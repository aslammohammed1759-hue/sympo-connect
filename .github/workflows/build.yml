name: Build SympoConnect

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SympoConnect_Complete_Project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SympoConnect_Complete_Project/package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Check assistant function syntax
        run: node --check netlify/functions/assistant.mjs
      - name: Build production site
        run: npm run build
