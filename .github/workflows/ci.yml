name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Build frontend
        run: npm run build

  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile tracked backend source
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          backend = Path("backend")
          sources = [
              path
              for path in backend.rglob("*.py")
              if not {"venv", ".venv", "__pycache__"}.intersection(path.parts)
          ] if backend.exists() else []

          if not sources:
              print("No backend Python source found; skipping syntax compilation.")
          else:
              for source in sources:
                  py_compile.compile(str(source), doraise=True)
              print(f"Compiled {len(sources)} backend Python file(s).")
          PY
